    <div class="cards">
      <p>test</p>
    </div>
    <div class="container mt-3">
      <button class="btn btn-danger" onclick="clearAllRounds()">
        Clear All Rounds
      </button>
    </div>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
    <script>
      async function loadRounds() {
        try {
          const response = await fetch("http://192.168.4.185:8000/rounds");
          if (response.ok) {
            const rounds = await response.json();
            displayRounds(rounds);
            return rounds;
          }
        } catch (error) {
          console.log("error: " + error);
        }
      }

      function displayRounds(rounds) {
        const cardsDiv = document.querySelector(".cards");
        cardsDiv.innerHTML = ""; // Clear existing content

        rounds.forEach((round) => {
          const card = `
      <div class="card mb-3">
        <div class="card-body">
          <h5 class="card-title">${round.f_name} ${round.l_name}</h5>
          <p><strong>Date:</strong> ${round.date}</p>
          <p><strong>Score:</strong> ${round.round_score} (${round.holes_played} holes)</p>
          <p><strong>GIR:</strong> ${round.GIR} | <strong>FH:</strong>${round.FH} | <strong>Putts:</strong> ${round.putts}</p>
          <p><strong>Course:</strong> ${round.course_name}</P>
        </div>
      </div>
    `;
          cardsDiv.innerHTML += card;
        });
      }

      async function clearAllRounds() {
        if (
          confirm(
            "Are you sure you want to delete all rounds? This cannot be undone.",
          )
        ) {
          try {
            const response = await fetch("http://192.168.4.185:8000/rounds", {
              method: "DELETE",
            });
            if (response.ok) {
              alert("All rounds deleted");
              loadRounds(); // Reload the page to show empty list
            }
          } catch (error) {
            console.log("error: " + error);
          }
        }
      }

      window.addEventListener("load", loadRounds);
    </script>
  </body>
</html>
