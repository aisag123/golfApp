<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Golf Course Map</title>
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    />
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
        padding: 0;
      }
      #map {
        height: 100%;
        width: 100%;
      }
    </style>
  </head>
  <body>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
      const API_KEY = "AIzaSyBFZGBYyxfoOy7RTtfog3jRz6PC4mrkpn8";

      let map = L.map("map").setView(
        [46.92810857320751, -96.7672371045954],
        18, //zoom level
      );

      // Create session and load Google 2D Tiles
      async function initializeTiles() {
        try {
          // Create a session for Google 2D Tiles API
          const response = await fetch(
            `https://tile.googleapis.com/v1/createSession?key=${API_KEY}`,
            {
              method: "POST",
              headers: {
                "Content-Type": "application/json",
              },
              body: JSON.stringify({
                mapType: "satellite",
                language: "en-US",
                region: "US",
              }),
            },
          );

          const data = await response.json();
          const session = data.session;

          // Add Google 2D Tiles layer with session
          L.tileLayer(
            `https://tile.googleapis.com/v1/2dtiles/{z}/{x}/{y}?session=${session}&key=${API_KEY}`,
            {
              attribution: "&copy; Google",
              maxZoom: 22,
            },
          ).addTo(map);
        } catch (error) {
          console.error("Error creating session:", error);
          // Fallback to basic Google tiles
          L.tileLayer("https://mt1.google.com/vt/lyrs=s&x={x}&y={y}&z={z}", {
            attribution: "&copy; Google",
            maxZoom: 22,
          }).addTo(map);
        }
      }

      initializeTiles();

      // Create a circle marker for user location
      let locationMarker = null;

      function updateLocation() {
        if (navigator.geolocation) {
          navigator.geolocation.getCurrentPosition(
            (position) => {
              const userLocation = [
                position.coords.latitude,
                position.coords.longitude,
              ];

              if (locationMarker) {
                // Update existing marker position
                locationMarker.setLatLng(userLocation);
              } else {
                // Create new circle marker
                locationMarker = L.circleMarker(userLocation, {
                  radius: 8,
                  fillColor: "#4285F4",
                  color: "#ffffff",
                  weight: 2,
                  opacity: 1,
                  fillOpacity: 0.8,
                }).addTo(map);

                // Center map on first location
                map.setView(userLocation, 18);
              }
            },
            (error) => {
              console.log("Geolocation error:", error);
            },
          );
        }
      }

      // Update location immediately
      updateLocation();

      setInterval(updateLocation, 10000); //update every 10 seconds
    </script>
  </body>
</html>
