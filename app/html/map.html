<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Golf Course Map</title>
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
        padding: 0;
      }
      #map {
        height: 100%;
        width: 100%;
        background-color: #504f4f;
      }
      .container-top {
        position: absolute;
        top: 20px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 1000;
        width: 90vw;
        max-width: 450px;
        display: flex;
      }
      .content-top {
        display: flex;
        flex-direction: row;
        align-items: center;
        width: 100%;
        height: 60px;
        background-color: #222;
        border-radius: 15px;
      }
      .content-top,
      .hole-name {
        font-size: 21px;
        color: #058d42;
        margin: 10px;
      }
      .content-top,
      .hole-yards {
        font-size: 17px;
        color: #fff;
        margin: 5px;
      }
      .content-top .btn {
        border-color: #058d42;
        border-radius: 10px;
        border-width: 1.5px;
        margin-left: auto;
        margin-right: 10px;
      }
      .content-top .btn:hover {
        background-color: #058d42;
        color: #fff;
      }
      .container-bottom {
        position: absolute;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 1000;
        width: 90vw;
        max-width: 450px;
        display: flex;
      }
      .content-bottom {
        display: flex;
        flex-direction: row;
        align-items: center;
        justify-content: space-between;
        width: 100%;
        height: 60px;
        background-color: #222;
        border-radius: 15px;
        padding: 0 10px;
      }
      .content-bottom .add-shot-btn {
        border-color: #058d42;
        width: 110px;
        border-radius: 10px;
        border-width: 1.5px;
        margin-right: 10px;
      }
      .content-bottom .add-shot-btn:hover {
        background-color: #058d42;
        color: #fff;
      }
      .add-putt-container {
        display: flex;
        align-items: center;
        gap: 10px;
        color: white;
        align-items: center;
      }
      .add-putt-container .putt-btn {
        border-color: #058d42;
        border-radius: 10px;
        border-width: 1.5px;
        width: 45px;
        height: 32px;
        line-height: 18px;
        padding: 0;
        display: inline-flex;
        align-items: center;
        justify-content: center;
      }
      .add-putt-container .putt-btn:hover {
        background-color: #058d42;
        color: #fff;
      }
      .add-putt-container .putt-label {
        margin: 0;
      }
      .total-shots-container {
        display: flex;
        flex-direction: column;
        column-gap: 0px;
        border-width: 1.5px;
        border-style: solid;
        border-color: #058d42;
        border-radius: 10px;
        padding-left: 20px;
        padding-right: 20px;
      }
      .total-shots-container p,
      .total-shots-container h5 {
        color: white;
        text-align: center;
        margin-bottom: -2px;
      }
    </style>
  </head>
  <body>
    <div id="map"></div>

    <div class="row" id="distances">
      <div class="col-12 text-center">
        <h5>Distances</h5>
        <p>Distance to hole <span id="distanceToHole">--</span> yards</p>
        <p>Distance From Tee <span id="distanceFromHole">--</span> yards</p>
      </div>
    </div>

    <div class="container-top">
      <div class="content-top">
        <h1 class="hole-name">Hole <span id="holeNumber">--</span></h1>
        <h1 class="hole-yards">
          <span id="holeYards">--</span> yards | Par
          <span id="holePar">--</span>
        </h1>
        <div class="btn btn-dark" onclick="lastHole()">Last hole</div>
        <div class="btn btn-dark" onclick="nextHole()">Next hole</div>
      </div>
    </div>

    <div class="container-bottom">
      <div class="content-bottom">
        <div class="btn btn-dark add-shot-btn">Add shot</div>
        <div class="total-shots-container">
          <h5><span id="total-shots">0</span></h5>
          <p>Shots</p>
        </div>
        <div class="add-putt-container">
          <div class="btn btn-dark putt-btn">-</div>
          <p class="putt-label"><span id="putts">0</span> putts</p>
          <div class="btn btn-dark putt-btn">+</div>
        </div>
      </div>
    </div>
    <script src="logic.js?v=2"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
      initMap();

      // Check if we navigated from course search
      const storedLat = localStorage.getItem("mapLat");
      const storedLon = localStorage.getItem("mapLon");

      if (storedLat && storedLon && map) {
        map.setView([parseFloat(storedLat), parseFloat(storedLon)], 19);
        localStorage.removeItem("mapLat");
        localStorage.removeItem("mapLon");
      }
    </script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
