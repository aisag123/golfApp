<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Golf Course Map</title>
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    />
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
        padding: 0;
      }
      #map {
        height: 100%;
        width: 100%;
      }
    </style>
  </head>
  <body>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
      const API_KEY = "AIzaSyBFZGBYyxfoOy7RTtfog3jRz6PC4mrkpn8";

      // Create a session for Google tiles
      let session = "";

      let map = L.map("map").setView(
        [46.92810857320751, -96.7672371045954],
        18, //zoom level
      );

      // Google satellite tile layer
      L.tileLayer("https://mt1.google.com/vt/lyrs=s&x={x}&y={y}&z={z}", {
        attribution: "&copy; Google",
        maxZoom: 22,
      }).addTo(map);

      // Create a circle marker for user location
      let locationMarker = null;

      function updateLocation() {
        if (navigator.geolocation) {
          navigator.geolocation.getCurrentPosition(
            (position) => {
              const userLocation = [
                position.coords.latitude,
                position.coords.longitude,
              ];

              if (locationMarker) {
                // Update existing marker position
                locationMarker.setLatLng(userLocation);
              } else {
                // Create new circle marker
                locationMarker = L.circleMarker(userLocation, {
                  radius: 8,
                  fillColor: "#4285F4",
                  color: "#ffffff",
                  weight: 2,
                  opacity: 1,
                  fillOpacity: 0.8,
                }).addTo(map);

                // Center map on first location
                map.setView(userLocation, 18);
              }
            },
            (error) => {
              console.log("Geolocation error:", error);
            },
          );
        }
      }

      // Update location immediately
      updateLocation();

      setInterval(updateLocation, 10000); //update every 10 seconds
    </script>
  </body>
</html>
