<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Golf Course Map</title>
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
        padding: 0;
      }
      #map {
        height: 100%;
        width: 100%;
        background-color: #504f4f;
      }
      .hole-buttons {
        position: absolute;
        top: 60px;
        left: 10px;
        z-index: 1000;
        display: flex;
        flex-direction: column;
        gap: 8px;
        max-height: 70vh;
        overflow-y: auto;
      }
      .hole-btn {
        background: #222;
        color: #fff;
        border: none;
        border-radius: 8px;
        padding: 10px 16px;
        margin: 0;
        font-size: 16px;
        cursor: pointer;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
      }
      .hole-btn:hover {
        background: #444;
      }
      #distances {
        position: absolute;
        top: 10px;
        right: 50px;
        z-index: 1000;
        background-color: rgb(108, 108, 108);
        color: white;
        border-radius: 10px;
      }
      @media (max-width: 650px) {
        #distances {
          margin-top: 10px;
          right: 50%;
          transform: translateX(50%);
        }
      }
      #add-shot {
        position: absolute;
        bottom: 10px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 1000;
      }
    </style>
  </head>
  <body>
    <div id="map"></div>

    <div class="row" id="distances">
      <div class="col-12 text-center">
        <h5>Distances</h5>
        <p>Distance to hole <span id="distanceToHole">--</span> yards</p>
        <p>Distance From Tee <span id="distanceFromHole">--</span> yards</p>
      </div>
    </div>

    <div class="btn-dark" id="add-shot"><button>add shot</button></div>
    <!-- Hole selector button -->
    <div class="hole-buttons">
      <button class="hole-btn" onclick="moveToHole('hole1')">Hole 1</button>
      <button class="hole-btn" onclick="moveToHole('hole2')">Hole 2</button>
      <button class="hole-btn" onclick="moveToHole('hole3')">Hole 3</button>
      <button class="hole-btn" onclick="moveToHole('hole4')">Hole 4</button>
      <button class="hole-btn" onclick="moveToHole('hole5')">Hole 5</button>
      <button class="hole-btn" onclick="moveToHole('hole6')">Hole 6</button>
      <button class="hole-btn" onclick="moveToHole('hole7')">Hole 7</button>
      <button class="hole-btn" onclick="moveToHole('hole8')">Hole 8</button>
      <button class="hole-btn" onclick="moveToHole('hole9')">Hole 9</button>
    </div>
    <script src="logic.js?v=2"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
      initMap();

      // Check if we navigated from course search
      const storedLat = localStorage.getItem("mapLat");
      const storedLon = localStorage.getItem("mapLon");

      if (storedLat && storedLon && map) {
        map.setView([parseFloat(storedLat), parseFloat(storedLon)], 19);
        localStorage.removeItem("mapLat");
        localStorage.removeItem("mapLon");
      }
    </script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
