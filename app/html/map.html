<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Golf Course Map</title>
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
        padding: 0;
      }
      #map {
        height: 100%;
        width: 100%;
        background-color: #504f4f;
      }
      .btn-group {
        position: absolute;
        top: 10px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 1000;
      }
      #distances {
        position: absolute;
        top: 10px;
        right: 50px;
        z-index: 1000;
        background-color: rgb(108, 108, 108);
        color: white;
        border-radius: 10px;
      }
    </style>
  </head>
  <body>
    <div id="map"></div>

    <div class="row" id="distances">
      <div class="col-12 text-center">
        <h5>Distances</h5>
        <p>Distance to hole <span id="distanceToHole">--</span> yards</p>
        <p>Distance From Tee <span id="distanceFromHole">--</span> yards</p>
      </div>
    </div>
    <!-- Hole selector button -->
    <div class="btn-group">
      <button class="btn btn-secondary btn-lg" type="button">
        Select Hole
      </button>
      <button
        type="button"
        class="btn btn-lg btn-secondary dropdown-toggle dropdown-toggle-split"
        data-bs-toggle="dropdown"
        aria-expanded="false"
      >
        <span class="visually-hidden">Toggle Dropdown</span>
      </button>
      <ul class="dropdown-menu">
        <li>
          <a
            class="dropdown-item"
            href="#"
            onclick="
              moveToHole('hole1');
              return false;
            "
            >Hole 1</a
          >
        </li>
        <li>
          <a
            class="dropdown-item"
            href="#"
            onclick="
              moveToHole('hole2');
              return false;
            "
            >Hole 2</a
          >
        </li>
        <li>
          <a
            class="dropdown-item"
            href="#"
            onclick="
              moveToHole('hole3');
              return false;
            "
            >Hole 3</a
          >
        </li>
        <li>
          <a
            class="dropdown-item"
            href="#"
            onclick="
              moveToHole('hole4');
              return false;
            "
            >Hole 4</a
          >
        </li>
        <li>
          <a
            class="dropdown-item"
            href="#"
            onclick="
              moveToHole('hole5');
              return false;
            "
            >Hole 5</a
          >
        </li>
        <li>
          <a
            class="dropdown-item"
            href="#"
            onclick="
              moveToHole('hole6');
              return false;
            "
            >Hole 6</a
          >
        </li>
        <li>
          <a
            class="dropdown-item"
            href="#"
            onclick="
              moveToHole('hole7');
              return false;
            "
            >Hole 7</a
          >
        </li>
        <li>
          <a
            class="dropdown-item"
            href="#"
            onclick="
              moveToHole('hole8');
              return false;
            "
            >Hole 8</a
          >
        </li>
        <li>
          <a
            class="dropdown-item"
            href="#"
            onclick="
              moveToHole('hole9');
              return false;
            "
            >Hole 9</a
          >
        </li>
      </ul>
    </div>
    <script src="logic.js?v=2"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
      initMap();

      // Check if we navigated from course search
      const storedLat = localStorage.getItem("mapLat");
      const storedLon = localStorage.getItem("mapLon");

      if (storedLat && storedLon && map) {
        map.setView([parseFloat(storedLat), parseFloat(storedLon)], 19);
        localStorage.removeItem("mapLat");
        localStorage.removeItem("mapLon");
      }
    </script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
