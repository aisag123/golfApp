<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SCORES</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="format.css" />
  </head>
  <body>
    <nav class="navbar navbar-expand-lg bg-body-tertiary">
      <div class="container-fluid">
        <a class="navbar-brand" href="index.html">Home</a>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarSupportedContent"
          aria-controls="navbarSupportedContent"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarSupportedContent">
          <ul class="navbar-nav me-auto mb-2 mb-lg-0">
            <li class="nav-item">
              <a class="nav-link" href="add_score.html">Add Score</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="rounds.html">View Rounds</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="stats.html">Stats</a>
            </li>
            <!-- <li class="nav-item">
              <a class="nav-link" href="calculate_strokes.html"
                >Calculate Strokes</a
              >
            </li> -->
          </ul>
        </div>
      </div>
    </nav>
    <div class="head">
      <img src="images/holes.jpg" alt="img" />
    </div>
    <div class="container">
      <div class="input f_name">
        <label for="f_name">First Name:</label>
        <input class="form-control" type="text" id="f_name" required />
      </div>
      <div class="input l_name">
        <label for="l_name">Last Name</label>
        <input class="form-control" type="text" id="l_name" />
      </div>
      <div class="input holes">
        <label for="holes">Holes Played</label>
        <input class="form-control" type="text" id="holes" required />
      </div>
      <div class="input score">
        <label for="score">Round Score</label>
        <input class="form-control" type="text" id="round score" />
      </div>
      <div class="input gir">
        <label for="gir">GIR</label>
        <input class="form-control" type="text" id="gir" />
      </div>
      <div class="input putts">
        <label for="putts">Putts</label>
        <input class="form-control" type="text" id="putts" />
      </div>
      <div class="input fh">
        <label for="fh">FH</label>
        <input class="form-control" type="text" id="fh" />
      </div>
      <div class="input course">
        <label for="course">Course Name</label>
        <input class="form-control" type="text" id="course" />
      </div>
      <div class="input date">
        <label for="date">Date</label>
        <input class="form-control" type="date" id="date" />
      </div>
      <div class="submit">
        <button type="button" class="btn btn-dark" id="submitBtn">
          Submit Round
        </button>
      </div>
    </div>

    <!-- Stats Display Section -->
    <div class="stats-container mt-4" id="statsSection" style="display: none">
      <div class="card">
        <div class="card-header bg-dark text-white">
          <h5>Your Stats</h5>
        </div>
        <div class="card-body">
          <div class="row">
            <div class="col-md-6">
              <p>
                <strong>Total Rounds:</strong> <span id="totalRounds"></span>
              </p>
              <p><strong>Average Score:</strong> <span id="avgScore"></span></p>
              <p><strong>Best Score:</strong> <span id="bestScore"></span></p>
              <p><strong>Worst Score:</strong> <span id="worstScore"></span></p>
            </div>
            <div class="col-md-6">
              <p><strong>Average GIR:</strong> <span id="avgGir"></span></p>
              <p><strong>Average Putts:</strong> <span id="avgPutts"></span></p>
              <p id="handicapDisplay" style="display: none">
                <strong>Handicap:</strong> <span id="handicap"></span>
              </p>
            </div>
          </div>
          <div class="alert alert-success mt-3">
            <strong>Last Round:</strong> Score: <span id="lastScore"></span>,
            GIR: <span id="lastGir"></span>, Putts: <span id="lastPutts"></span>
          </div>
        </div>
      </div>
    </div>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
    <script>
      document
        .getElementById("submitBtn")
        .addEventListener("click", async function () {
          // Get input values
          const roundData = {
            f_name: document.getElementById("f_name").value,
            l_name: document.getElementById("l_name").value,
            holes_played: parseInt(document.getElementById("holes").value),
            round_score: parseInt(document.getElementById("round score").value),
            FH: parseInt(document.getElementById("fh").value),
            GIR: parseInt(document.getElementById("gir").value),
            putts: parseInt(document.getElementById("putts").value),
            date: document.getElementById("date").value,
            course_name: document.getElementById("course").value,
          };

          // Validate required fields
          if (!roundData.f_name || !roundData.holes_played) {
            alert(
              "Please fill in all required fields (First Name and Holes Played)",
            );
            return;
          }

          try {
            // Send data to backend
            const response = await fetch("http://10.49.250.1:8000/Round", {
              method: "POST",
              headers: {
                "Content-Type": "application/json",
              },
              body: JSON.stringify(roundData),
            });

            if (response.ok) {
              alert("Round submitted successfully!");

              // Clear the form
              document.getElementById("f_name").value = "";
              document.getElementById("l_name").value = "";
              document.getElementById("holes").value = "";
              document.getElementById("round score").value = "";
              document.getElementById("gir").value = "";
              document.getElementById("putts").value = "";
              document.getElementById("date").value = "";
            } else {
              alert("Error submitting round. Please try again.");
            }
          } catch (error) {
            console.error("Error:", error);
            alert(
              "Error connecting to server. Please make sure the server is running.",
            );
          }
        });
    </script>
  </body>
</html>
