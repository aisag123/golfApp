<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Golf App</title>
    <link rel="stylesheet" href="format.css" />
  </head>
  <body>
    <nav class="topnav">
      <a href="" class="left"><img src="images/icon.png" alt="Image" /></a>
      <a href="" class="right">Saved Rounds</a>
      <a href="" class="right">Stats</a>
    </nav>

    <div class="head">
      <img src="images/golfHead.jpg" alt="GOLf" />
    </div>

    <div class="input score">
      <h1>Add Completed Round</h1>
    </div>

    <div class="container">
      <div class="input f_name">
        <label for="f_name">First Name:</label>
        <input type="text" id="f_name" required />
      </div>
      <div class="input l_name">
        <label for="l_name">Last Name</label>
        <input type="text" id="l_name" />
      </div>
      <div class="input holes">
        <label for="holes">Holes Played</label>
        <input type="text" id="holes" required />
      </div>
      <div class="input score">
        <label for="score">Round Score</label>
        <input type="text" id="round score" />
      </div>
      <div class="input gir">
        <label for="gir">GIR</label>
        <input type="text" id="gir" />
      </div>
      <div class="input putts">
        <label for="putts">Putts</label>
        <input type="text" id="putts" />
      </div>
      <div class="input date">
        <label for="date">Date</label>
        <input type="date" id="date" />
      </div>
      <div class="submit">
        <button type="submit">Submit Round</button>
      </div>
    </div>
  </body>
</html>
