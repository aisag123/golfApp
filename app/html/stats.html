<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Golf Stats</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
  </head>
  <body>
    <nav class="navbar navbar-expand-lg bg-body-tertiary">
      <div class="container-fluid">
        <a class="navbar-brand" href="index.html">Home</a>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarSupportedContent"
          aria-controls="navbarSupportedContent"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarSupportedContent">
          <ul class="navbar-nav me-auto mb-2 mb-lg-0">
            <li class="nav-item">
              <a class="nav-link" href="add_score.html">Add Score</a>
            </li>
            <li>
              <a class="nav-link" href="rounds.html">View Rounds</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="stats.html">Stats</a>
            </li>
            <!-- <li class="nav-item">
              <a class="nav-link" href="calculate_strokes.html"
                >Calculate Strokes</a
              >
            </li> -->
          </ul>
        </div>
      </div>
    </nav>

    <div class="container mt-4">
      <div id="statsCard"></div>
    </div>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
    <script>
      async function loadStats() {
        try {
          const response = await fetch("http://localhost:8000/overall-stats");
          if (response.ok) {
            const stats = await response.json();
            displayStats(stats);
          }
        } catch (error) {
          console.log("error: " + error);
        }
      }

      function displayStats(stats) {
        const statsCard = document.getElementById("statsCard");

        if (!stats || stats.total_rounds === 0) {
          statsCard.innerHTML = `
            <div class="alert alert-info">
              <p>No rounds found. Add some rounds to see your stats!</p>
            </div>
          `;
          return;
        }

        statsCard.innerHTML = `
          <div class="card">
            <div class="card-header bg-dark text-white">
              <h3>Overall Statistics</h3>
            </div>
            <div class="card-body">
              <div class="row">
                <div class="col-md-6">
                  <h5>Scoring</h5>
                  <p><strong>Total Rounds:</strong> ${stats.total_rounds}</p>
                  <p><strong>Average Score:</strong> ${stats.average_score || "N/A"}</p>
                  <p><strong>Best Score:</strong> ${stats.best_score}</p>
                  <p><strong>Worst Score:</strong> ${stats.worst_score}</p>
                </div>
                <div class="col-md-6">
                  <h5>Performance</h5>
                  <p><strong>Average GIR:</strong> ${stats.average_GIR}</p>
                  <p><strong>Average FH:</strong> ${stats.average_FH}</p>
                  <p><strong>Average Putts:</strong> ${stats.average_putts}</p>
                </div>
              </div>
            </div>
          </div>
        `;
      }

      window.addEventListener("load", loadStats);
    </script>
  </body>
</html>
