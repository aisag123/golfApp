<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bootstrap demo</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
  </head>
  <style>
    .search-bar-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
      margin-top: 2rem;
    }
    .search-bar-form {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      max-width: 350px;
    }
    .search-bar-form input {
      width: 100%;
      margin-bottom: 0.75rem;
    }
    .search-bar-form button {
      width: 100%;
    }
    .body {
      width: 100%;
      height: 100%;
    }
    #searchResults {
      max-height: 300px;
      overflow-y: auto;
      width: 600px;
      margin: 20px auto;
      background: #f8f9fa;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
      padding: 8px;
    }
    @media (max-width: 650px) {
      #searchResults {
        width: 90%;
      }
    }
  </style>
  <body>
    <div
      class="container vh-100 d-flex flex-column justify-content-center align-items-center"
    >
      <h1 class="text-center">Search Courses</h1>
      <div class="search-bar-container">
        <form
          class="search-bar-form"
          role="search"
          id="courseSearch"
          onsubmit="
            event.preventDefault();
            searchCourse(this.elements[0].value);
          "
        >
          <input
            class="form-control"
            type="search"
            placeholder="Search"
            aria-label="Search"
          />
          <button class="btn btn-dark btn-lg mt-2" type="submit">Search</button>
        </form>
      </div>
      <div id="searchResults" class="mt-3 w-100"></div>
    </div>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
    <script src="/static/logic.js?v=20260405-1"></script>
  </body>
</html>
